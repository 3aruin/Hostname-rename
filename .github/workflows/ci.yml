# .github/workflows/ci.yml
#
# CI pipeline for Hostname-Rename.
#
# Jobs:
#   lint     -- PSScriptAnalyzer on all .ps1 files (real PS 5.1 + 7.x legs -- BUG-013a)
#   test     -- Pester unit tests (real PS 5.1 + 7.x legs)
#   manifest -- Verify $MANIFEST hashes in launcher.ps1 match the module files
#   placeholder -- Fail if REPLACE_WITH_COMMIT_SHA was accidentally committed

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    shell: pwsh

jobs:

  # Lint
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    strategy:
      # The shell IS the version selector (BUG-013a / F-04): 'powershell' is real
      # Windows PowerShell 5.1, 'pwsh' is PS 7.x. The old matrix declared a
      # ps-version axis that no step referenced, so both legs ran under pwsh.
      matrix:
        include:
          - ps-version: "5.1"
            shell: powershell
          - ps-version: "7.x"
            shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          # TLS 1.2 for the 5.1 leg -- Windows PowerShell may not offer it to
          # PSGallery by default. No-op where it is already enabled.
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer (PowerShell ${{ matrix.ps-version }})
        shell: ${{ matrix.shell }}
        run: |
          $files  = Get-ChildItem -Path . -Filter "*.ps1" -Recurse
          $issues = $files | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning
          }

          if ($issues) {
              $issues | Format-Table -AutoSize
              Write-Error "PSScriptAnalyzer found $($issues.Count) issue(s). See table above."
              exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues found."

  # Pester unit tests
  test:
    name: Pester Tests
    runs-on: windows-latest
    needs: lint
    strategy:
      # Same shell-as-version-selector pattern as lint (F-04): the suite claims
      # 5.1 support, so run it under real Windows PowerShell too.
      matrix:
        include:
          - ps-version: "5.1"
            shell: powershell
          - ps-version: "7.x"
            shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          # -SkipPublisherCheck: Windows PowerShell ships Pester 3.4 signed with a
          # different certificate; without it the 5.1 leg cannot install Pester 5.
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester (PowerShell ${{ matrix.ps-version }})
        shell: ${{ matrix.shell }}
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path       = "./tests"
          $cfg.Output.Verbosity = "Detailed"
          $cfg.TestResult.Enabled    = $true
          $cfg.TestResult.OutputPath = "test-results.xml"
          $cfg.TestResult.OutputFormat = "NUnitXml"

          $result = Invoke-Pester -Configuration $cfg -PassThru

          if ($result.FailedCount -gt 0) {
              Write-Error "$($result.FailedCount) Pester test(s) failed."
              exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-ps${{ matrix.ps-version }}   # unique per leg; v4 rejects duplicate names
          path: test-results.xml

  # Manifest hash validation
  manifest:
    name: Manifest Hash Check
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Verify $MANIFEST hashes match module files
        run: |
          # Parse the $MANIFEST block from launcher.ps1
          $launcherContent = Get-Content ./launcher.ps1 -Raw

          # Extract hash entries: "filename.ps1" = "hexhash". Case-insensitive hex
          # (F-08.2): the old [a-f0-9] silently SKIPPED verification of an
          # uppercase-pasted hash instead of checking it.
          $manifestEntries = [regex]::Matches(
              $launcherContent,
              '"(?<file>[^"]+\.ps1)"\s*=\s*"(?<hash>[a-fA-F0-9]{64})"'
          )

          if ($manifestEntries.Count -eq 0) {
              if ($launcherContent -match 'REPLACE_WITH_COMMIT_SHA') {
                  Write-Warning "No hash entries found in `$MANIFEST — skipping check (unpinned dev/template state)."
                  exit 0
              }
              # Pinned SHA + zero parsable hashes = the manifest was never
              # regenerated. Fail loudly instead of reporting a green check that
              # verified nothing (F-08.2, mirrors the launcher's own mixed-manifest guard).
              Write-Error "launcher.ps1 pins a commit SHA but no `$MANIFEST hash entries parsed — run .\tools\Get-Hashes.ps1 and paste the full block."
              exit 1
          }

          $failed = $false

          foreach ($entry in $manifestEntries) {
              $fileName     = $entry.Groups["file"].Value
              $expectedHash = $entry.Groups["hash"].Value.ToLower()

              $filePath = Join-Path (Get-Location) $fileName
              if (-not (Test-Path $filePath)) {
                  Write-Error "  MISSING: $fileName (listed in manifest but not found)"
                  $failed = $true
                  continue
              }

              # Raw on-disk bytes -- byte-identical with tools/Get-Hashes.ps1 and with
              # what raw.githubusercontent.com serves (BUG-017; .gitattributes pins
              # *.ps1 to LF so checkout bytes equal blob bytes).
              $bytes    = [System.IO.File]::ReadAllBytes($filePath)
              $actualHash = ([BitConverter]::ToString(
                  [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
              ) -replace '-').ToLower()

              if ($actualHash -ne $expectedHash) {
                  Write-Error "  HASH MISMATCH: $fileName"
                  Write-Error "    Expected : $expectedHash"
                  Write-Error "    Actual   : $actualHash"
                  Write-Error "    → Run .\tools\Get-Hashes.ps1 and update `$MANIFEST in launcher.ps1"
                  $failed = $true
              } else {
                  Write-Host "  OK: $fileName"
              }
          }

          if ($failed) { exit 1 }
          Write-Host "All manifest hashes verified."

  # Placeholder commit guard
  placeholder:
    name: Placeholder Check (ADR-002)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fail if REPLACE_WITH_COMMIT_SHA is present in launcher.ps1
        run: |
          if grep -q "REPLACE_WITH_COMMIT_SHA" launcher.ps1; then
            echo "::error file=launcher.ps1::COMMIT_SHA placeholder not replaced."
            echo ""
            echo "launcher.ps1 still contains REPLACE_WITH_COMMIT_SHA."
            echo "This placeholder must be replaced with a real 40-character commit SHA"
            echo "before merging. See README.md -> Deployment Workflow."
            exit 1
          fi
          echo "No placeholder found — launcher.ps1 is pinned to a real SHA."
        # main only: lets the canonical repo keep its default template state green; remove for hard enforcement everywhere.
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}